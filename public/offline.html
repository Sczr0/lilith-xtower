<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>离线中 · Phigros Query</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --accent: #3b82f6;
          --border: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        text-align: center;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .title { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px; }
      .desc { font-size: 0.95rem; color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
      .btn {
        display: inline-block;
        appearance: none;
        border: 0;
        border-radius: 9999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 24px;
        cursor: pointer;
      }
      .btn:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="title">当前处于离线状态</h1>
      <p class="desc">网络连接似乎已断开。你可以尝试重新连接，或回到首页查看已缓存的内容。</p>
      <button class="btn" type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
